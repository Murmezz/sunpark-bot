<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>SUNPARK · Меню</title>
  <link rel="stylesheet" href="/menu-preview.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/menu-preview.js" defer></script>
</head>
<body>
  <div class="menu-paper">
    <header class="menu-header">
      <div class="brand">
        <img id="pdf-logo" class="pdf-logo" width="210" height="84" alt="SUNPARK Grill Bar — Saint Petersburg">
        <div class="night-brand"><span>GRILL &amp; BAR</span><h1>SUNPARK</h1></div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>
        <input id="search" type="search" placeholder="Найти блюдо или напиток" autocomplete="off" aria-label="Поиск по всему меню">
      </label>
    </header>
    <main>
      <p id="status" class="status" role="status" aria-live="polite">Загружаем меню…</p>
      <section id="menu-hub" aria-labelledby="hub-title" hidden>
        <h2 id="hub-title" class="ruled-title"><span>Наше меню</span></h2>
        <nav id="groups" class="group-tabs" aria-label="Части меню"></nav>
        <p class="navigation-hint">Выберите раздел</p>
        <nav id="categories" class="category-grid" aria-label="Разделы меню"></nav>
      </section>
      <section id="catalog-view" aria-labelledby="section-title" hidden>
        <button id="back-to-sections" class="back-link" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13"/></svg>К разделам меню</button>
        <h2 id="section-title" class="ruled-title"><span>Меню</span></h2>
        <p id="catalog-hint" class="catalog-hint">Нажмите на блюдо, чтобы посмотреть состав</p>
        <div id="items" class="items"></div>
        <p id="category-footer" class="category-footer"></p>
      </section>
    </main>
  </div>
  <dialog id="dish-dialog" aria-labelledby="dish-name">
    <button id="close-dialog" class="close-dialog" type="button" aria-label="Закрыть состав"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <p id="dish-section" class="dish-section"></p>
    <h2 id="dish-name"></h2>
    <p id="dish-price" class="dish-price"></p>
    <div class="detail-rule"></div>
    <h3>Состав и подача</h3>
    <p id="dish-description" class="dish-description"></p>
    <p id="dish-footer" class="dish-footer"></p>
    <button id="back-to-menu" class="primary-button" type="button">Вернуться к меню</button>
  </dialog>
</body>
</html>
